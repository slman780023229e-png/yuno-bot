name: ARTHUR BOT Runner

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */4 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: arthur-whatsapp-bot
  cancel-in-progress: false

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 270

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install

      - name: Run Bot with Automatic Repository Saving
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          MONGO_URI: ${{ secrets.MONGO_URI }}
          ARTHUR_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set +e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          save_changes() {
            echo "Checking repository changes..."

            git add -A -- . \
              ':(exclude)ملف_الاتصال/creds.json' \
              ':(exclude)ملف_الاتصال/*.json' \
              ':(exclude).env' \
              ':(exclude).env.*' \
              ':(exclude)**/.env' \
              ':(exclude)**/.env.*' \
              ':(exclude)**/node_modules' \
              ':(exclude)**/node_modules/**' \
              ':(exclude)**/auth_info_baileys' \
              ':(exclude)**/auth_info_baileys/**' \
              ':(exclude)**/*.pem' \
              ':(exclude)**/*.key' \
              ':(exclude)**/*.p12' \
              ':(exclude)**/*.pfx' || return 1

            if ! git diff --cached --quiet; then
              git commit -m "Auto-save ARTHUR repository progress" || return 1
            else
              echo "No new changes to commit."
              return 0
            fi

            git fetch origin \
              "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}" || return 1

            if [ "$(git rev-list --count "origin/${GITHUB_REF_NAME}..HEAD")" -gt 0 ]; then
              if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "Push failed; synchronizing with GitHub..."

                git fetch origin \
                  "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}" || return 1

                git -c rebase.autoStash=true rebase \
                  "origin/${GITHUB_REF_NAME}" || {
                    git rebase --abort || true
                    echo "Sync conflict. Changes remain in the runner."
                    return 1
                  }

                git push origin "HEAD:${GITHUB_REF_NAME}" || return 1
              fi

              echo "Repository changes saved successfully."
            else
              echo "No new commits to push."
            fi
          }

          cleanup_and_exit() {
            echo "Shutting down runner. Attempting final save..."
            save_changes || echo "Final save failed."
            exit "${1:-0}"
          }

          trap 'cleanup_and_exit 0' SIGTERM SIGINT

          echo "ARTHUR BOT supervisor started. Auto-save interval: 5 minutes."

          while true; do
            node start.js &
            BOT_PID=$!
            echo "ARTHUR BOT started (PID: $BOT_PID)."

            LAST_SAVE=$(date +%s)

            while kill -0 "$BOT_PID" 2>/dev/null; do
              sleep 5
              NOW=$(date +%s)
              if [ $((NOW - LAST_SAVE)) -ge 300 ]; then
                if kill -0 "$BOT_PID" 2>/dev/null; then
                  save_changes || echo "Auto-save failed; will retry later."
                fi
                LAST_SAVE=$(date +%s)
              fi
            done

            wait "$BOT_PID"
            BOT_STATUS=$?
            echo "Bot exited with status $BOT_STATUS. Saving progress and restarting immediately..."
            save_changes || echo "Save after exit failed."
            sleep 2
          done
