name: ARTHUR BOT Runner

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write
  actions: write

# يمنع تشغيل نسختين من هذا البوت على الفرع نفسه في الوقت ذاته.
concurrency:
  group: arthur-whatsapp-bot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # كل تشغيل يستعيد أحدث Cache متاح مطابق للفرع.
      # run_attempt يجعل مفتاح الحفظ مختلفًا حتى عند إعادة تشغيل Workflow نفسه.
      - name: Restore WhatsApp Session
        id: restore_session
        uses: actions/cache/restore@v4
        with:
          path: ملف_الاتصال/
          key: arthur-session-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            arthur-session-${{ github.ref_name }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        shell: bash
        run: |
          set -e
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Bot with Automatic Repository Saving
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          ARTHUR_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
        shell: bash
        run: |
          set +e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          save_changes() {
            echo "Checking repository changes..."

            git add -A -- . \
              ':(exclude)ملف_الاتصال' \
              ':(exclude)ملف_الاتصال/**' \
              ':(exclude).env' \
              ':(exclude).env.*' \
              ':(exclude)**/.env' \
              ':(exclude)**/.env.*' \
              ':(exclude)**/node_modules' \
              ':(exclude)**/node_modules/**' \
              ':(exclude)**/auth_info_baileys' \
              ':(exclude)**/auth_info_baileys/**' \
              ':(exclude)**/creds.json' \
              ':(exclude)**/*.pem' \
              ':(exclude)**/*.key' \
              ':(exclude)**/*.p12' \
              ':(exclude)**/*.pfx' || return 1

            if ! git diff --cached --quiet; then
              git commit -m "Auto-save ARTHUR repository progress" || return 1
            fi

            git fetch origin \
              "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}" || return 1

            if [ "$(git rev-list --count "origin/${GITHUB_REF_NAME}..HEAD")" -gt 0 ]; then
              if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "Push failed; trying to synchronize with GitHub..."

                git fetch origin \
                  "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}" || return 1

                git -c rebase.autoStash=true rebase \
                  "origin/${GITHUB_REF_NAME}" || {
                    git rebase --abort || true
                    echo "Sync conflict. Changes remain in the runner."
                    return 1
                  }

                git push origin "HEAD:${GITHUB_REF_NAME}" || return 1
              fi

              echo "Repository changes saved."
            else
              echo "No new commits to push."
            fi
          }

          node start.js &
          BOT_PID=$!

          echo "ARTHUR BOT started. Auto-save interval: 5 minutes."

          while kill -0 "$BOT_PID" 2>/dev/null; do
            sleep 300

            if kill -0 "$BOT_PID" 2>/dev/null; then
              save_changes || echo "Auto-save failed; will retry later."
            fi
          done

          wait "$BOT_PID"
          BOT_STATUS=$?

          echo "Bot stopped. Attempting final repository save..."
          save_changes || echo "Final repository save failed."

          exit "$BOT_STATUS"

      # لا نحفظ Cache جديدًا إذا كانت creds.json مفقودة أو غير صالحة.
      # لا نحذف ولا نعدّل أي ملف من ملفات الجلسة هنا.
      - name: Validate WhatsApp Session Before Cache Save
        id: session_check
        if: always()
        shell: bash
        run: |
          set -u
          CREDS="ملف_الاتصال/creds.json"

          if [ ! -s "$CREDS" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Session credentials are missing or empty; skipping new cache."
            exit 0
          fi

          if ! jq -e 'type == "object"' "$CREDS" >/dev/null 2>&1; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "creds.json is not valid JSON; skipping new cache."
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Session credentials look valid; cache save is allowed."

      # Cache keys غير قابلة للاستبدال؛ نستخدم مفتاحًا جديدًا لكل محاولة تشغيل.
      - name: Save WhatsApp Session
        id: save_session
        if: always() && steps.session_check.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: ملف_الاتصال/
          key: arthur-session-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      # تنظيف Cache القديم فقط بعد نجاح الحفظ.
      # يحتفظ بآخر نسختين لهذا الفرع، ولا يحذف ملفات الجلسة داخل المجلد.
      - name: Clean Old Session Cache Versions
        if: always() && steps.save_session.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_REF: ${{ github.ref }}
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -uo pipefail

          API_URL="https://api.github.com/repos/${REPOSITORY}/actions/caches"
          PREFIX="arthur-session-${BRANCH_NAME}-"
          CACHE_LIST="$(mktemp)"
          trap 'rm -f "$CACHE_LIST"' EXIT

          echo "Looking for old session caches for ${BRANCH_REF}..."

          PAGE=1
          while true; do
            if ! DATA="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --get \
              --data-urlencode "ref=${BRANCH_REF}" \
              --data-urlencode "per_page=100" \
              --data-urlencode "page=${PAGE}" \
              "$API_URL" 2>/dev/null)"; then
              echo "Warning: Could not list session caches; leaving all caches untouched."
              exit 0
            fi

            COUNT="$(jq '.actions_caches | length' <<< "$DATA")"

            jq -r --arg prefix "$PREFIX" '
              .actions_caches[]?
              | select(.key | startswith($prefix))
              | [.id, .created_at, .key]
              | @tsv
            ' <<< "$DATA" >> "$CACHE_LIST"

            [ "$COUNT" -lt 100 ] && break
            PAGE=$((PAGE + 1))
          done

          TOTAL="$(wc -l < "$CACHE_LIST" | tr -d ' ')"
          echo "Found ${TOTAL} matching session cache(s)."

          if [ "$TOTAL" -le 2 ]; then
            echo "Keeping all available caches; nothing to clean."
            exit 0
          fi

          # أحدث نسختين تبقيان للاحتياط. تُحذف الأقدم فقط.
          sort -t "$(printf '\t')" -k2,2r "$CACHE_LIST" \
            | awk -F '\t' 'NR > 2 { print $1 }' \
            | while IFS= read -r CACHE_ID; do
                [ -n "$CACHE_ID" ] || continue

                echo "Removing old cache ID ${CACHE_ID}..."
                if curl --fail --silent --show-error -X DELETE \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "${API_URL}/${CACHE_ID}" >/dev/null; then
                  echo "Removed cache ID ${CACHE_ID}."
                else
                  echo "Warning: Could not remove cache ID ${CACHE_ID}; continuing."
                fi
              done

          echo "Old cache cleanup finished."
