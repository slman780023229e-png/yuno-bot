name: ARTHUR BOT Runner

on:
  workflow_dispatch:
    inputs:
      new_session:
        description: 'ابدأ جلسة واتساب جديدة واحذف الجلسات القديمة'
        required: true
        type: boolean
        default: true
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: arthur-whatsapp-bot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # عند تشغيل workflow يدويًا، يكون new_session=true افتراضيًا:
      # احذف مجلد الجلسة المحلي وكل نسخ الجلسة المخزنة قبل تشغيل البوت.
      - name: Delete Old WhatsApp Session and Caches
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.new_session == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_REF: ${{ github.ref }}
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "ملف_الاتصال"
          mkdir -p "ملف_الاتصال"
          PREFIX="arthur-session-${BRANCH_NAME}-"
          echo "Deleting old session caches for ${BRANCH_REF}..."
          gh api --paginate "repos/${REPOSITORY}/actions/caches?ref=${BRANCH_REF}&per_page=100" \
            --jq ".actions_caches[]? | select(.key | startswith(\"${PREFIX}\")) | .id" \
            | while IFS= read -r CACHE_ID; do
                [ -n "$CACHE_ID" ] || continue
                echo "Deleting old cache ID: $CACHE_ID"
                gh api --method DELETE "repos/${REPOSITORY}/actions/caches/${CACHE_ID}" || true
              done
          echo "Old local session and matching cache versions deleted."

      # لا تستعد أي جلسة عند طلب جلسة جديدة. في التشغيل المجدول، استعد آخر جلسة محفوظة.
      - name: Restore WhatsApp Session
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.new_session == true) }}
        uses: actions/cache/restore@v4
        with:
          path: ملف_الاتصال/
          key: arthur-session-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            arthur-session-${{ github.ref_name }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        shell: bash
        run: |
          set -e
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Bot with Automatic Repository Saving
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          ARTHUR_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          save_changes() {
            git add -A \
              ':!ملف_الاتصال' \
              ':!ملف_الاتصال/**' \
              ':!node_modules' \
              ':!node_modules/**' \
              ':!.env' \
              ':!**/.env' \
              ':!*.key' \
              ':!*.pem' \
              ':!creds.json' \
              ':!**/creds.json'
            if ! git diff --cached --quiet; then
              git commit -m "chore: automatic bot updates [skip ci]"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          }

          node start.js &
          BOT_PID=$!
          while kill -0 "$BOT_PID" 2>/dev/null; do
            sleep 300
            if kill -0 "$BOT_PID" 2>/dev/null; then
              save_changes
            fi
          done
          wait "$BOT_PID"
          BOT_STATUS=$?
          save_changes
          exit "$BOT_STATUS"

      - name: Validate WhatsApp Session Before Cache Save
        id: session_check
        if: always()
        shell: bash
        run: |
          set -u
          CREDS="ملف_الاتصال/creds.json"
          if [ ! -s "$CREDS" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No credentials file; session will not be cached."
            exit 0
          fi
          if ! jq -e 'type == "object" and .registered == true' "$CREDS" >/dev/null; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "WhatsApp session is not registered; session will not be cached."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Registered WhatsApp session found."

      - name: Save New WhatsApp Session
        id: save_session
        if: ${{ always() && steps.session_check.outputs.ready == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ملف_الاتصال/
          key: arthur-session-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      # بعد حفظ الجلسة الجديدة بنجاح، احذف كل النسخ الأقدم لنفس الفرع.
      - name: Delete Older Session Cache Versions
        if: ${{ always() && steps.save_session.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_REF: ${{ github.ref }}
          BRANCH_NAME: ${{ github.ref_name }}
          CURRENT_KEY: arthur-session-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="arthur-session-${BRANCH_NAME}-"
          gh api --paginate "repos/${REPOSITORY}/actions/caches?ref=${BRANCH_REF}&per_page=100" \
            --jq ".actions_caches[]? | select(.key | startswith(\"${PREFIX}\")) | select(.key != \"${CURRENT_KEY}\") | .id" \
            | while IFS= read -r CACHE_ID; do
                [ -n "$CACHE_ID" ] || continue
                echo "Deleting previous cache ID: $CACHE_ID"
                gh api --method DELETE "repos/${REPOSITORY}/actions/caches/${CACHE_ID}" || true
              done
          echo "Only the newly saved session cache is intended to remain."
