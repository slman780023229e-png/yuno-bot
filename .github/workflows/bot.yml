name: ARTHUR BOT Runner

on:
  workflow_dispatch:
    inputs:
      reset_session:
        description: "حذف جلسة واتساب القديمة وبدء جلسة جديدة"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write
  actions: write

# يمنع تشغيل نسختين من البوت على الفرع نفسه في الوقت ذاته.
concurrency:
  group: arthur-whatsapp-bot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # عند طلب جلسة جديدة يدويًا، احذف Cache القديم لهذا الفرع قبل التشغيل.
      # هذا لا يُنفّذ في التشغيل المجدول أو التشغيل اليدوي العادي.
      - name: Delete Old WhatsApp Session Caches
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_session }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_REF: ${{ github.ref }}
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          API_URL="https://api.github.com/repos/${REPOSITORY}/actions/caches"
          PREFIX="arthur-session-${BRANCH_NAME}-"
          CACHE_LIST="$(mktemp)"
          trap 'rm -f "$CACHE_LIST"' EXIT
          PAGE=1

          echo "Finding old session caches for ${BRANCH_REF}..."
          while true; do
            DATA="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --get \
              --data-urlencode "ref=${BRANCH_REF}" \
              --data-urlencode "per_page=100" \
              --data-urlencode "page=${PAGE}" \
              "$API_URL")"

            COUNT="$(jq '.actions_caches | length' <<< "$DATA")"
            jq -r --arg prefix "$PREFIX" '
              .actions_caches[]?
              | select(.key | startswith($prefix))
              | .id
            ' <<< "$DATA" >> "$CACHE_LIST"

            [ "$COUNT" -lt 100 ] && break
            PAGE=$((PAGE + 1))
          done

          while IFS= read -r CACHE_ID; do
            [ -n "$CACHE_ID" ] || continue
            echo "Deleting old session cache ID ${CACHE_ID}..."
            curl --fail --silent --show-error -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}/${CACHE_ID}" >/dev/null
          done < "$CACHE_LIST"

          echo "Old session caches removed."

      # في وضع إعادة الربط لا نستعيد أي Cache؛ نبدأ بمجلد جلسة فارغ.
      - name: Prepare Fresh WhatsApp Session
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_session }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "ملف_الاتصال"
          mkdir -p -- "ملف_الاتصال"
          echo "Old local session removed. New WhatsApp pairing is required."

      # في التشغيل الطبيعي فقط، استعد أحدث Cache محفوظ.
      - name: Restore WhatsApp Session
        id: restore_session
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.reset_session) }}
        uses: actions/cache/restore@v4
        with:
          path: ملف_الاتصال/
          key: arthur-session-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            arthur-session-${{ github.ref_name }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Bot with Automatic Repository Saving
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          ARTHUR_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
        shell: bash
        run: |
          set +e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          save_changes() {
            echo "Checking repository changes..."

            git add -A -- . \
              ':(exclude)ملف_الاتصال' \
              ':(exclude)ملف_الاتصال/**' \
              ':(exclude).env' \
              ':(exclude).env.*' \
              ':(exclude)**/.env' \
              ':(exclude)**/.env.*' \
              ':(exclude)**/node_modules' \
              ':(exclude)**/node_modules/**' \
              ':(exclude)**/auth_info_baileys' \
              ':(exclude)**/auth_info_baileys/**' \
              ':(exclude)**/creds.json' \
              ':(exclude)**/*.pem' \
              ':(exclude)**/*.key' \
              ':(exclude)**/*.p12' \
              ':(exclude)**/*.pfx' || return 1

            if ! git diff --cached --quiet; then
              git commit -m "Auto-save ARTHUR repository progress" || return 1
            fi

            git fetch origin \
              "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}" || return 1

            if [ "$(git rev-list --count "origin/${GITHUB_REF_NAME}..HEAD")" -gt 0 ]; then
              if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "Push failed; trying to synchronize with GitHub..."
                git fetch origin \
                  "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}" || return 1
                git -c rebase.autoStash=true rebase \
                  "origin/${GITHUB_REF_NAME}" || {
                    git rebase --abort || true
                    echo "Sync conflict. Changes remain in the runner."
                    return 1
                  }
                git push origin "HEAD:${GITHUB_REF_NAME}" || return 1
              fi
              echo "Repository changes saved."
            else
              echo "No new commits to push."
            fi
          }

          node start.js &
          BOT_PID=$!
          echo "ARTHUR BOT started. Auto-save interval: 5 minutes."

          while kill -0 "$BOT_PID" 2>/dev/null; do
            sleep 300
            if kill -0 "$BOT_PID" 2>/dev/null; then
              save_changes || echo "Auto-save failed; will retry later."
            fi
          done

          wait "$BOT_PID"
          BOT_STATUS=$?
          echo "Bot stopped. Attempting final repository save..."
          save_changes || echo "Final repository save failed."
          exit "$BOT_STATUS"

      # احفظ الجلسة فقط إذا كانت بيانات الاعتماد مسجلة وبنيتها الأساسية سليمة.
      - name: Validate WhatsApp Session Before Cache Save
        id: session_check
        if: always()
        shell: bash
        run: |
          set -u
          CREDS="ملف_الاتصال/creds.json"
          if [ ! -s "$CREDS" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Credentials missing; skipping cache save."
            exit 0
          fi

          if ! jq -e '
            type == "object"
            and .registered == true
            and (.noiseKey.private.data | type == "array")
            and (.signedIdentityKey.private.data | type == "array")
            and (.signedPreKey.keyPair.private.data | type == "array")
          ' "$CREDS" >/dev/null 2>&1; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Credentials invalid or incomplete; skipping cache save."
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Credential structure looks valid."

      - name: Save WhatsApp Session
        id: save_session
        if: always() && steps.session_check.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: ملف_الاتصال/
          key: arthur-session-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      # تنظيف Cache قديم بعد حفظ جلسة صالحة؛ الاحتفاظ بآخر نسختين.
      - name: Clean Old Session Cache Versions
        if: always() && steps.save_session.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_REF: ${{ github.ref }}
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -uo pipefail
          API_URL="https://api.github.com/repos/${REPOSITORY}/actions/caches"
          PREFIX="arthur-session-${BRANCH_NAME}-"
          CACHE_LIST="$(mktemp)"
          trap 'rm -f "$CACHE_LIST"' EXIT
          PAGE=1

          while true; do
            if ! DATA="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --get \
              --data-urlencode "ref=${BRANCH_REF}" \
              --data-urlencode "per_page=100" \
              --data-urlencode "page=${PAGE}" \
              "$API_URL" 2>/dev/null)"; then
              echo "Cannot list caches; leaving them untouched."
              exit 0
            fi

            COUNT="$(jq '.actions_caches | length' <<< "$DATA")"
            jq -r --arg prefix "$PREFIX" '
              .actions_caches[]?
              | select(.key | startswith($prefix))
              | [.id, .created_at]
              | @tsv
            ' <<< "$DATA" >> "$CACHE_LIST"
            [ "$COUNT" -lt 100 ] && break
            PAGE=$((PAGE + 1))
          done

          TOTAL="$(wc -l < "$CACHE_LIST" | tr -d ' ')"
          if [ "$TOTAL" -le 2 ]; then
            echo "Found ${TOTAL} caches; nothing to clean."
            exit 0
          fi

          sort -t "$(printf '\t')" -k2,2r "$CACHE_LIST" \
            | awk -F '\t' 'NR > 2 { print $1 }' \
            | while IFS= read -r CACHE_ID; do
                [ -n "$CACHE_ID" ] || continue
                curl --fail --silent --show-error -X DELETE \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "${API_URL}/${CACHE_ID}" >/dev/null \
                  && echo "Removed old cache ID ${CACHE_ID}." \
                  || echo "Could not remove cache ID ${CACHE_ID}; continuing."
              done

          echo "Cache cleanup finished."
